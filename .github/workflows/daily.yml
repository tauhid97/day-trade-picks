name: Daily picks

on:
  schedule:
    - cron: "38 14 * * 1-5"
    - cron: "38 15 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "17 14 * * 6"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [auto, hello, backtest, approve, scan, grade, report]
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COMMUNITY_CHAT_ID: ${{ secrets.TELEGRAM_COMMUNITY_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py ${{ github.event.inputs.task || (github.event.schedule == '17 14 * * 6' && 'backtest') || 'auto' }}
      - name: Save results
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Update picks $(date -u +%F)"
          git push
